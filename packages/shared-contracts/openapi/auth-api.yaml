openapi: 3.1.0
info:
  title: Jobocate Auth API
  version: 0.1.0
  description: |
    Authentication, session, and account-credential endpoints owned by
    `tenant-auth-service`. JWT is HS256 (MVP). Includes a local-only
    demo-token endpoint that is disabled in production.

servers:
  - url: http://localhost:8090
    description: Local
  - url: https://api.jobocate.example/auth
    description: Production (illustrative)

security:
  - bearerJwt: []

paths:
  /api/auth/signup:
    post:
      summary: Candidate self-signup
      operationId: signupCandidate
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Signup successful; verification email sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
        '429': { $ref: './_common.yaml#/components/responses/TooManyRequests' }

  /api/auth/login:
    post:
      summary: Login with email + password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Tokens issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '429': { $ref: './_common.yaml#/components/responses/TooManyRequests' }

  /api/auth/refresh:
    post:
      summary: Exchange refresh token for new access (rotates refresh)
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      summary: Revoke current session
      operationId: logout
      responses:
        '204': { description: Logged out. }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }

  /api/auth/logout-all:
    post:
      summary: Revoke all sessions for the user
      operationId: logoutAll
      responses:
        '204': { description: All sessions revoked. }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }

  /api/auth/forgot-password:
    post:
      summary: Begin password reset flow
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Always returns 200 to prevent email enumeration. }

  /api/auth/reset-password:
    post:
      summary: Complete password reset with token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 12 }
      responses:
        '204': { description: Password reset; user may now log in. }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '410': { description: Token expired or already used. }

  /api/auth/verify-email:
    post:
      summary: Confirm email verification token
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Email verified. }
        '410': { description: Token expired or already used. }

  /api/auth/accept-invite:
    post:
      summary: Tenant user accepts invite, sets password
      operationId: acceptInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token, new_password]
              properties:
                invite_token: { type: string }
                new_password: { type: string, minLength: 12 }
                display_name: { type: string }
      responses:
        '200':
          description: Invite accepted; tokens returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '410': { description: Invite expired or already used. }

  /api/auth/me:
    get:
      summary: Current session info
      operationId: getMe
      responses:
        '200':
          description: User identity, active tenant, roles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }

  /api/auth/demo-token:
    post:
      summary: '[Local only] Issue demo HS256 token for tenant + subject'
      operationId: demoToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, subject]
              properties:
                tenant_id: { type: string, format: uuid }
                subject: { type: string }
                roles:
                  type: array
                  items: { $ref: './_common.yaml#/components/schemas/Role' }
      responses:
        '200':
          description: Demo token (local dev).
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
        '404': { description: Endpoint disabled in production. }

components:
  securitySchemes:
    bearerJwt: { $ref: './_common.yaml#/components/securitySchemes/bearerJwt' }

  schemas:
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        display_name: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        tenant_slug: { type: string, description: Optional when user belongs to multiple tenants. }

    AuthTokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds until access_token expires. }
        active_tenant_id: { type: string, format: uuid }
        roles:
          type: array
          items: { $ref: './_common.yaml#/components/schemas/Role' }

    SessionInfo:
      type: object
      required: [user_id, email, active_tenant_id, roles]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        active_tenant_id: { type: string, format: uuid }
        roles:
          type: array
          items: { $ref: './_common.yaml#/components/schemas/Role' }
        tenants:
          type: array
          items:
            type: object
            properties:
              tenant_id: { type: string, format: uuid }
              tenant_slug: { type: string }
              display_name: { type: string }
              roles:
                type: array
                items: { $ref: './_common.yaml#/components/schemas/Role' }
