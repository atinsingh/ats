openapi: 3.1.0
info:
  title: Jobocate Search API (Gateway Facade)
  version: 0.3.0
  description: |
    Hybrid lexical + vector job and candidate search via the Go `search-gateway`.
    Tenant filter is **always** added by the gateway and never trusted from
    the client. Index document shapes:
    - jobs: `schemas/job-index-document.schema.json`
    - candidates: `schemas/candidate-index-document.schema.json`

    Supersedes `recruiter-search-gateway.yaml` v0.2.0 (which is retained for
    backwards compatibility while clients migrate).

servers:
  - url: http://localhost:7070
    description: Local (search-gateway)

security:
  - bearerJwt: []

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /v1/search/jobs:
    post:
      summary: Hybrid job search (recruiter-side)
      operationId: searchJobs
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobSearchRequest' }
      responses:
        '200':
          description: Hits + facets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSearchResponse' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '503': { $ref: './_common.yaml#/components/responses/ServiceUnavailable' }

  /v1/search/jobs/public:
    post:
      summary: Public marketplace job search (unauthenticated, PUBLISHED only)
      operationId: searchJobsPublic
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobSearchRequest' }
      responses:
        '200':
          description: Hits + facets (public projection — recruiter-only fields excluded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSearchResponse' }

  /v1/search/candidates:
    post:
      summary: Recruiter resume database search
      operationId: searchCandidates
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateSearchRequest' }
      responses:
        '200':
          description: Hits + facets (consent + visibility filtered).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateSearchResponse' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }

  /v1/autocomplete/jobs:
    get:
      summary: Job title autocomplete
      operationId: autocompleteJobs
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Suggestions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { type: string }

  /internal/v1/index/jobs:
    post:
      summary: Index a single job document (search-orchestrator → gateway)
      operationId: indexJob
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: 'Conforms to `schemas/job-index-document.schema.json`.'
              type: object
              additionalProperties: true
      responses:
        '202': { description: Accepted. }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }

  /internal/v1/index/jobs/bulk:
    post:
      summary: Bulk index jobs
      operationId: indexJobsBulk
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '202': { description: Accepted. }

  /internal/v1/index/candidates:
    post:
      summary: Index a candidate document
      operationId: indexCandidate
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: 'Conforms to `schemas/candidate-index-document.schema.json`.'
              type: object
              additionalProperties: true
      responses:
        '202': { description: Accepted. }

components:
  securitySchemes:
    bearerJwt: { $ref: './_common.yaml#/components/securitySchemes/bearerJwt' }
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Service-to-service shared secret. Replace with mTLS / signed service JWT post-MVP.

  parameters:
    TenantHeader:
      name: X-Jobocate-Tenant-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Tenant routing hint. Authoritative tenant comes from JWT.

  schemas:
    JobSearchRequest:
      type: object
      properties:
        query:
          type: string
          default: ''
          description: Empty = match-all in tenant.
        filters: { $ref: '#/components/schemas/JobSearchFilters' }
        vector:
          type: array
          items: { type: number }
          description: Optional dense embedding for hybrid kNN.
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
        cursor: { type: string }

    JobSearchFilters:
      type: object
      additionalProperties: false
      properties:
        employment_type: { $ref: './_common.yaml#/components/schemas/EmploymentType' }
        remote_policy: { $ref: './_common.yaml#/components/schemas/RemotePolicy' }
        country: { type: string }
        region: { type: string }
        city: { type: string }
        skills:
          type: array
          items: { type: string }
        salary_at_least_cents: { type: integer, minimum: 0 }
        salary_min_cents: { type: integer, minimum: 0 }
        salary_max_cents: { type: integer, minimum: 0 }
        experience_min_years: { type: integer, minimum: 0 }
        experience_max_years: { type: integer, minimum: 0 }
        status: { $ref: './_common.yaml#/components/schemas/JobStatus' }
        company_name: { type: string }

    CandidateSearchRequest:
      type: object
      properties:
        query: { type: string, default: '' }
        filters: { $ref: '#/components/schemas/CandidateSearchFilters' }
        vector:
          type: array
          items: { type: number }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
        cursor: { type: string }

    CandidateSearchFilters:
      type: object
      additionalProperties: false
      properties:
        skills:
          type: array
          items: { type: string }
        country: { type: string }
        availability: { $ref: './_common.yaml#/components/schemas/Availability' }
        salary_expectation_max_cents: { type: integer, minimum: 0 }
        total_experience_years_min: { type: number, minimum: 0 }
        total_experience_years_max: { type: number, minimum: 0 }

    SearchTotal:
      type: object
      required: [value, relation]
      properties:
        value: { type: integer, minimum: 0 }
        relation: { type: string, enum: [eq, gte] }

    SearchHit:
      type: object
      required: [id, score, document]
      properties:
        id: { type: string }
        score: { type: number }
        highlight:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        document:
          type: object
          additionalProperties: true

    FacetBucket:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer, minimum: 0 }

    JobSearchResponse:
      type: object
      required: [total, hits, facets]
      properties:
        total: { $ref: '#/components/schemas/SearchTotal' }
        hits:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        facets:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/FacetBucket' }
        facets_partial: { type: boolean, default: false }
        next_cursor: { type: ['string', 'null'] }

    CandidateSearchResponse:
      allOf:
        - { $ref: '#/components/schemas/JobSearchResponse' }
