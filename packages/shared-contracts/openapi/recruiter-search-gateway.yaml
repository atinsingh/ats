openapi: 3.1.0
info:
  title: Jobocate Recruiter Search (Gateway Facade)
  version: 0.2.0
  description: >
    Hybrid job search over the denormalized OpenSearch job index. Responses are normalized by
    `search-gateway` (not raw OpenSearch bodies). Index field names align with
    `schemas/job-index-document.schema.json`.

paths:
  /v1/search/jobs:
    post:
      summary: Hybrid job search (lexical + optional vector) with tenant-scoped filters and facets
      operationId: searchJobs
      parameters:
        - name: X-Jobocate-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant scope for the query (mandatory).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSearchRequest'
            examples:
              matchAll:
                summary: All jobs for tenant (paged)
                value:
                  query: ''
                  limit: 25
              keywordAndFilters:
                summary: Keyword + facet filters
                value:
                  query: engineer
                  limit: 25
                  filters:
                    employment_type: FULL_TIME
                    remote_policy: REMOTE_FIRST
                    location: Remote (US)
                    salary_at_least_cents: 15000000
                    status: OPEN
      responses:
        '200':
          description: Ranked hits, optional highlights, and facet buckets for the tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchResponse'
              example:
                total:
                  value: 2
                  relation: eq
                hits:
                  - id: 22222222-2222-2222-2222-222222222201
                    score: 4.2
                    highlight:
                      title:
                        - '<em>Backend</em> Engineer'
                    document:
                      tenant_id: 11111111-1111-1111-1111-111111111111
                      job_id: 22222222-2222-2222-2222-222222222201
                      title: Staff Backend Engineer
                      status: OPEN
                      employment_type: FULL_TIME
                      remote_policy: REMOTE_FIRST
                      location: Remote (US)
                facets:
                  employment_type:
                    - value: FULL_TIME
                      count: 2
                  remote_policy:
                    - value: REMOTE_FIRST
                      count: 1
                    - value: HYBRID
                      count: 1
        '400':
          description: Invalid JSON or payload
        '401':
          description: Missing or invalid tenant header

components:
  schemas:
    JobSearchRequest:
      type: object
      description: >
        `query` may be empty for match-all within the tenant. Lexical search targets `title` and
        `description` when `query` is non-empty.
      properties:
        query:
          type: string
          default: ''
        filters:
          $ref: '#/components/schemas/JobSearchFilters'
        vector:
          type: array
          items:
            type: number
          description: >
            Optional embedding for hybrid kNN on `title_vector` (gateway expects length 128 when present);
            never replaces lexical + filters.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25

    JobSearchFilters:
      type: object
      description: >
        All filters are ANDed with the mandatory tenant filter. Unknown keys are ignored by the
        gateway until formally added to this schema.
      properties:
        employment_type:
          type: string
          description: Exact match on indexed `employment_type` (e.g. FULL_TIME, CONTRACT).
        remote_policy:
          type: string
          description: Exact match on indexed `remote_policy` (e.g. REMOTE_FIRST, HYBRID, ONSITE).
        location:
          type: string
          description: Exact match on `location.keyword` (case-sensitive; index normalized strings).
        status:
          type: string
          description: Exact match on `status` (e.g. OPEN, DRAFT).
        salary_at_least_cents:
          type: integer
          format: int64
          description: >
            Jobs whose compensation range may reach at least this amount (max OR min >= value),
            in smallest currency units (e.g. US cents).

    JobSearchResponse:
      type: object
      required: [total, hits, facets]
      properties:
        total:
          type: object
          required: [value, relation]
          properties:
            value:
              type: integer
              minimum: 0
            relation:
              type: string
              enum: [eq, gte]
        hits:
          type: array
          items:
            $ref: '#/components/schemas/JobSearchHit'
        facets:
          type: object
          description: Facet key → sorted bucket list `{ value, count }`.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/FacetBucket'

    JobSearchHit:
      type: object
      required: [id, score, document]
      properties:
        id:
          type: string
          description: OpenSearch document id (same as `job_id`).
        score:
          type: number
          format: float
        highlight:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        document:
          type: object
          description: Denormalized job document (`_source`).
          additionalProperties: true

    FacetBucket:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
          minimum: 0
