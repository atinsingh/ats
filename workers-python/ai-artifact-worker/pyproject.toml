[project]
name = "ai-artifact-worker"
version = "0.1.0"
description = "Consumes ai.artifact.requested events and posts model output back to application-service /internal/v1/ai-artifacts/{id}/result."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "kafka-python>=2.0.2",
  "httpx>=0.28.0",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]
# Wire-in real LLM clients per deployment; the worker is provider-agnostic.
openai = ["openai>=1.50.0"]
anthropic = ["anthropic>=0.40.0"]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
