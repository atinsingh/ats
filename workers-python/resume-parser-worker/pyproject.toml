[project]
name = "resume-parser-worker"
version = "0.2.0"
description = "Consumes raw resume uploads, extracts structured fields, normalizes text, emits parsed artifacts (no embeddings)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "kafka-python>=2.0.2",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
# Optional bits that pull weight only when actually downloading from S3 / parsing PDFs.
s3 = ["boto3>=1.35.0"]
pdf = ["pypdf>=5.1.0"]
docx = ["python-docx>=1.1.2"]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
